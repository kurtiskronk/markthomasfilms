name: Warm jsDelivr Cache

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  warm-jsdelivr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Warm current commit assets
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          BASE_URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${COMMIT_SHA}"

          warm_file() {
            FILE="$1"

            echo "Warming: $FILE"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --output /dev/null \
              "$BASE_URL/$FILE"
          }

          # Manifest is requested first by loader.js.
          warm_file "assets.json"

          # Warm the CSS bundle listed in assets.json.
          CSS_FILE="$(jq -r '.css // empty' assets.json)"

          if [[ -n "$CSS_FILE" ]]
          then
            warm_file "$CSS_FILE"
          fi

          # Warm every explicitly approved JS file.
          while IFS= read -r JS_FILE
          do
            if [[ -n "$JS_FILE" ]]
            then
              warm_file "$JS_FILE"
            fi
          done < <(
            jq -r '.js[]?' assets.json
          )

          echo "jsDelivr warming complete."
