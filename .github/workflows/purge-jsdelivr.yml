name: Purge jsDelivr Cache

on:
	push:
		branches:
			- main

	workflow_dispatch:

jobs:
	purge-jsdelivr:
		runs-on: ubuntu-latest

		steps:
			- name: Check out repository
				uses: actions/checkout@v4

			- name: Purge jsDelivr assets
				shell: bash
				run: |
					BASE_URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@main"

					echo "Purging loader.js"
					curl --fail --silent --show-error \
						"$BASE_URL/loader.js"

					echo ""

					find js dist \
						-type f \
						\( -name '*.js' -o -name '*.css' \) \
						-print0 |
					while IFS= read -r -d '' file
					do
						echo "Purging $file"

						curl --fail --silent --show-error \
							"$BASE_URL/$file"

						echo ""
					done

					echo "jsDelivr purge complete."