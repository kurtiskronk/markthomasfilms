name: Build Mark Thomas Films CSS

on:
  push:
		branches:
			- main
		paths:
			- "css/**/*.css"
			- ".github/workflows/build-css.yml"

	workflow_dispatch:

permissions:
	contents: write

jobs:
	build-css:
		runs-on: ubuntu-latest

		steps:
			- name: Check out repository
				uses: actions/checkout@v4

			- name: Build combined stylesheet
				shell: bash
				run: |
					mkdir -p dist

					: > dist/markthomasfilms.css

					while IFS= read -r file
					do
						echo "/* ==================================================" \
							>> dist/markthomasfilms.css

						echo "   SOURCE: $file" \
							>> dist/markthomasfilms.css

						echo "   ================================================== */" \
							>> dist/markthomasfilms.css

						echo "" \
							>> dist/markthomasfilms.css

						cat "$file" \
							>> dist/markthomasfilms.css

						echo "" \
							>> dist/markthomasfilms.css

						echo "" \
							>> dist/markthomasfilms.css

					done < <(
						find css \
							-maxdepth 1 \
							-type f \
							-name '*.css' \
							| sort
					)

			- name: Commit generated stylesheet
				shell: bash
				run: |
					if [[ -z "$(git status --porcelain -- dist/markthomasfilms.css)" ]]
					then
						echo "CSS bundle is already current."
						exit 0
					fi

					git config \
						user.name \
						"github-actions[bot]"

					git config \
						user.email \
						"41898282+github-actions[bot]@users.noreply.github.com"

					git add \
						dist/markthomasfilms.css

					git commit \
						-m "Rebuild CSS bundle"

					git push